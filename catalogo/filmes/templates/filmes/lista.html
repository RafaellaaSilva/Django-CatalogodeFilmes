{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RafaFlix - Catálogo de Filmes</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'filmes/styles.css' %}" />
</head>
<body>
    <header>
        <h1>RafaFlix</h1>
        <a href="{% url 'criar_filme' %}" class="btn-novo">+ Novo Filme</a>
    </header>

    <main>
        <ul class="lista-filmes">
            {% for filme in filmes %}
            <li class="filme-card">
                <img src="{{filme.capa}}" alt="Capa do filme {{filme.titulo}}" />
                <div class="filme-info">
                    <strong class="titulo">{{ filme.titulo }}</strong>
                    <span class="ano-genero">({{ filme.ano }}) - {{ filme.genero}}</span>
                    <div class="acoes">
                        <a href="{% url 'atualizar_filme' filme.pk %}" class="btn-editar">Editar</a>
                        <a href="{% url 'deletar_filme' filme.pk %}" class="btn-excluir">Excluir</a>
                    </div>
                </div>
            </li>
            {% empty %}
            <li class="nenhum-filme">Nenhum filme cadastrado.</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>

</html>
